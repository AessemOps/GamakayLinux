<?xml version="1.0" encoding="UTF-8"?>
<!-- lk67ctl: a 65% board with its right-hand column and knob. Drawn for
     this project (GPL-3.0-or-later), so nothing to attribute. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#242933"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67d5f2"/>
      <stop offset="1" stop-color="#8a6cf0"/>
    </linearGradient>
  </defs>

  <!-- Case -->
  <rect x="28" y="140" width="456" height="232" rx="30" fill="url(#body)"/>
  <rect x="28" y="140" width="456" height="232" rx="30" fill="none"
        stroke="#12161d" stroke-width="6"/>

  <!-- Row 1: number row, then the right-hand column starts -->
  <g fill="#dde3ec">
    <rect x="52" y="164" width="34" height="34" rx="7"/>
    <rect x="96" y="164" width="34" height="34" rx="7"/>
    <rect x="140" y="164" width="34" height="34" rx="7"/>
    <rect x="184" y="164" width="34" height="34" rx="7"/>
    <rect x="228" y="164" width="34" height="34" rx="7"/>
    <rect x="272" y="164" width="34" height="34" rx="7"/>
    <rect x="316" y="164" width="34" height="34" rx="7"/>
    <rect x="360" y="164" width="34" height="34" rx="7"/>
  </g>
  <!-- The knob and the right column, lit -->
  <circle cx="432" cy="181" r="21" fill="url(#lit)"/>
  <g fill="url(#lit)">
    <rect x="418" y="216" width="28" height="28" rx="6"/>
    <rect x="418" y="254" width="28" height="28" rx="6"/>
    <rect x="418" y="292" width="28" height="28" rx="6"/>
  </g>

  <!-- Row 2: the QWERTY row, one key lit as the "Fn layer" accent -->
  <g fill="#c9d1dd">
    <rect x="52" y="208" width="34" height="34" rx="7"/>
    <rect x="96" y="208" width="34" height="34" rx="7"/>
    <rect x="140" y="208" width="34" height="34" rx="7"/>
    <rect x="184" y="208" width="34" height="34" rx="7"/>
    <rect x="228" y="208" width="34" height="34" rx="7"/>
    <rect x="272" y="208" width="34" height="34" rx="7"/>
    <rect x="316" y="208" width="34" height="34" rx="7"/>
    <rect x="360" y="208" width="34" height="34" rx="7"/>
  </g>

  <!-- Row 3: home row, with the full-width Caps and Enter -->
  <g fill="#c9d1dd">
    <rect x="52" y="252" width="46" height="34" rx="7"/>
    <rect x="108" y="252" width="34" height="34" rx="7"/>
    <rect x="152" y="252" width="34" height="34" rx="7"/>
    <rect x="196" y="252" width="34" height="34" rx="7"/>
    <rect x="240" y="252" width="34" height="34" rx="7"/>
    <rect x="284" y="252" width="34" height="34" rx="7"/>
    <rect x="328" y="252" width="66" height="34" rx="7"/>
  </g>

  <!-- Row 4: bottom row, shifted row, wide space bar -->
  <g fill="#b8c1d0">
    <rect x="52" y="296" width="52" height="34" rx="7"/>
    <rect x="114" y="296" width="34" height="34" rx="7"/>
    <rect x="158" y="296" width="34" height="34" rx="7"/>
    <rect x="202" y="296" width="34" height="34" rx="7"/>
    <rect x="246" y="296" width="120" height="34" rx="7" fill="url(#lit)"/>
    <rect x="376" y="296" width="18" height="34" rx="7"/>
  </g>

  <!-- Arrow cluster, lit like the Fn-layer keys they carry -->
  <g fill="url(#lit)">
    <rect x="330" y="336" width="30" height="26" rx="6"/>
    <rect x="300" y="336" width="26" height="26" rx="6"/>
    <rect x="360" y="336" width="26" height="26" rx="6"/>
  </g>
</svg>

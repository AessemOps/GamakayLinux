[package]
name = "lk67-gui"
description = "iced GUI for GamaKay keyboards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "lk67-gui"
path = "src/main.rs"

[dependencies]
lk67-core.workspace = true
lk67-hidraw.workspace = true
iced = { version = "0.14", features = ["canvas", "smol"] }

[dev-dependencies]
# Check that the bundled font really has every glyph we point at it.
ttf-parser = "0.25"

name: release

# Builds the four package formats from a tag and attaches them to the release.
#
# Everything is built on ubuntu-22.04 (glibc 2.35) so the deb, rpm and AppImage
# run on 22.04+, Fedora 36+ and Arch; building on a newer runner would silently
# raise the glibc floor. The Arch package is built in an Arch container, as Arch
# requires.
#
# Each format is then installed into a container of its own distribution and the
# installed binary is run, so a package that cannot start is caught here rather
# than by a user. `gamakay --version` and `gamakay list` need no keyboard.

on:
  push:
    tags: ['v*']
  # Also on pull requests that touch packaging, so the pipeline is proven before
  # a tag exists: publishing stays gated on the tag below. `workflow_dispatch`
  # alone could not do this, since GitHub only offers it for workflows that are
  # already on the default branch.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Makefile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag, Cargo and PKGBUILD versions must agree
        run: |-
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"
          else
            ./scripts/check-release-version.sh
          fi

  build:
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the packaging tools
        run: |-
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools file
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz"
          tar -xzf nfpm.tar.gz -C "$HOME/.local/bin" nfpm
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --release --locked

      - name: Package (deb, rpm, AppImage)
        run: |-
          make package-deb package-rpm
          # appimagetool is itself an AppImage, and a runner has no FUSE, so it
          # runs itself extracted.
          make package-appimage APPIMAGETOOL="$HOME/.local/bin/appimagetool --appimage-extract-and-run"
          make package-verify
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |-
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  arch:
    needs: guard
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the package
        run: |-
          pacman -Syu --noconfirm base-devel git rust cargo
          # makepkg refuses to run as root; build as an unprivileged user.
          useradd -m builder
          # The PKGBUILD sources the release tarball; in CI the working tree is
          # the source of truth, so package it under the name the PKGBUILD wants.
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p "/tmp/src/gamakaylinux-$version"
          git archive HEAD | tar -x -C "/tmp/src/gamakaylinux-$version"
          tar -czf "/tmp/src/gamakaylinux-$version.tar.gz" -C /tmp/src "gamakaylinux-$version"
          chown -R builder /tmp/src
          install -d -o builder -g builder /home/builder/pkg
          install -o builder -g builder -m644 packaging/arch/PKGBUILD packaging/arch/gamakaylinux.install /home/builder/pkg/
          install -o builder -g builder -m644 "/tmp/src/gamakaylinux-$version.tar.gz" /home/builder/pkg/
          su builder -c 'cd ~/pkg && makepkg -f --noconfirm'
          cp /home/builder/pkg/*.pkg.tar.zst .
          ls -l ./*.pkg.tar.zst

      - name: Install and run it
        run: |-
          pacman -U --noconfirm ./*.pkg.tar.zst
          gamakay --version
          gamakay list
          test -f /usr/share/applications/gamakay.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/gamakay.png
          test -f /usr/lib/udev/rules.d/70-gamakay.rules

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: ./*.pkg.tar.zst

  verify-deb:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Install the .deb and run it
        run: |-
          sudo apt-get update
          sudo apt-get install -y ./dist/gamakaylinux_*_amd64.deb
          gamakay --version
          gamakay list
          test -f /usr/share/applications/gamakay.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/gamakay.png

  verify-rpm:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Install the .rpm and run it
        run: |-
          dnf install -y ./dist/gamakaylinux-*.rpm
          gamakay --version
          gamakay list
          test -f /usr/share/applications/gamakay.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/gamakay.png

  verify-appimage:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Run the AppImage's CLI
        run: |-
          chmod +x dist/*.AppImage
          # No FUSE on a runner: extract and run instead.
          ./dist/GamakayLinux-*-x86_64.AppImage --appimage-extract-and-run --version
          ./dist/GamakayLinux-*-x86_64.AppImage --appimage-extract-and-run list

  release:
    needs: [build, arch, verify-deb, verify-rpm, verify-appimage]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |-
            artifacts/packages/*.deb
            artifacts/packages/*.rpm
            artifacts/packages/*.AppImage
            artifacts/arch/*.pkg.tar.zst
          generate_release_notes: true

name: release

# Builds the four package formats from a tag and attaches them to the release.
#
# Everything is built on ubuntu-22.04 (glibc 2.35) so the deb, rpm and AppImage
# run on 22.04+, Fedora 36+ and Arch; building on a newer runner would silently
# raise the glibc floor. The Arch package is built in an Arch container, as Arch
# requires.
#
# Each format is then installed into a container of its own distribution and the
# installed binary is run, so a package that cannot start is caught here rather
# than by a user. `gamakay --version` and `gamakay list` need no keyboard.

on:
  push:
    tags: ['v*']
  # Also on pull requests that touch packaging, so the pipeline is proven before
  # a tag exists: publishing stays gated on the tag below. `workflow_dispatch`
  # alone could not do this, since GitHub only offers it for workflows that are
  # already on the default branch.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Makefile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only by default: the packaging jobs run on pull requests too, and none of
# them needs to write to the repository. Only the publishing job asks for more.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag, Cargo and PKGBUILD versions must agree
        run: |-
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"
          else
            ./scripts/check-release-version.sh
          fi

  build:
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the packaging tools
        run: |-
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools file
          mkdir -p "$HOME/.local/bin"
          # Both tools are executed in the job that mints the release, so both
          # are pinned to a tag and verified against a known digest: an asset
          # swapped upstream must not become code execution here.
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz"
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz -C "$HOME/.local/bin" nfpm
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $HOME/.local/bin/appimagetool" | sha256sum -c -
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A release must not ship something the tests reject.
      - name: Test
        run: cargo test --all --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package (deb, rpm, AppImage)
        run: |-
          make package-deb package-rpm
          # appimagetool is itself an AppImage, and a runner has no FUSE, so it
          # runs itself extracted.
          make package-appimage APPIMAGETOOL="$HOME/.local/bin/appimagetool --appimage-extract-and-run"
          make package-verify
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |-
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  arch:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the package in an Arch container
        run: |-
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # The PKGBUILD sources the published tag tarball. A tag does not exist
          # yet at this point, so synthesise the same tarball from the checkout —
          # it is also what makes this workflow usable before a release. The
          # checkout stays on the host (a `container:` job checks out without
          # .git, and `git archive` needs it).
          # Build the tarball straight from the working tree and mount *only*
          # it: an earlier version copied the checkout — including the .git that
          # holds the checkout credential — into the container.
          rm -rf /tmp/src && mkdir -p /tmp/src
          tar -czf "/tmp/src/gamakaylinux-$version.tar.gz" \
            --transform "s,^\.,gamakaylinux-$version," \
            --exclude=./.git --exclude=./target --exclude=./dist .
          mkdir -p out
          docker run --rm -v /tmp/src:/src:ro -v "$PWD/out:/out" -w /src archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel git rust cargo >/dev/null
              # makepkg refuses to run as root; build as an unprivileged user in
              # a writable copy. --nodeps because the runtime dependencies are
              # what the install step below is for: this container has no X, no
              # GL and no fonts, and the package must still build.
              useradd -m builder
              install -d -o builder -g builder /home/builder/pkg
              install -o builder -g builder -m644 /src/gamakaylinux-*.tar.gz /home/builder/pkg/
              # The PKGBUILD and its install scriptlet come out of the tarball
              # we just built, so they cannot drift from the source being built.
              su builder -c "cd ~/pkg && tar xzf gamakaylinux-*.tar.gz --wildcards 'gamakaylinux-*/packaging/arch/*' && install -m644 gamakaylinux-*/packaging/arch/PKGBUILD gamakaylinux-*/packaging/arch/gamakaylinux.install . && makepkg -f --noconfirm --nodeps"
              install -m644 /home/builder/pkg/*.pkg.tar.zst /out/
            '
          ls -l out

      - name: Install and run it
        run: |-
          docker run --rm -v "$PWD/out:/out:ro" archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed >/dev/null
            pacman -U --noconfirm /out/*.pkg.tar.zst
            gamakay --version
            gamakay list
            test -f /usr/share/applications/gamakay.desktop
            test -f /usr/share/icons/hicolor/256x256/apps/gamakay.png
            test -f /usr/lib/udev/rules.d/70-gamakay.rules
          '

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: out/*.pkg.tar.zst

  verify-deb:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Install the .deb and run it
        run: |-
          sudo apt-get update
          sudo apt-get install -y ./dist/gamakaylinux_*_amd64.deb
          gamakay --version
          gamakay list
          test -f /usr/share/applications/gamakay.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/gamakay.png

  verify-rpm:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Install the .rpm and run it
        run: |-
          dnf install -y ./dist/gamakaylinux-*.rpm
          gamakay --version
          gamakay list
          test -f /usr/share/applications/gamakay.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/gamakay.png

  verify-appimage:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Run the AppImage's CLI
        run: |-
          chmod +x dist/*.AppImage
          # No FUSE on a runner: extract and run instead.
          ./dist/GamakayLinux-*-x86_64.AppImage --appimage-extract-and-run --version
          ./dist/GamakayLinux-*-x86_64.AppImage --appimage-extract-and-run list

  release:
    needs: [build, arch, verify-deb, verify-rpm, verify-appimage]
    if: github.ref_type == 'tag' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |-
          cd artifacts
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.pkg.tar.zst' \) -exec sha256sum {} + | sed 's|  \./|  |' \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |-
            artifacts/SHA256SUMS
            artifacts/packages/*.deb
            artifacts/packages/*.rpm
            artifacts/packages/*.AppImage
            artifacts/arch/*.pkg.tar.zst
          generate_release_notes: true

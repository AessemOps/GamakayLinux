name: release

# Builds the four package formats from a tag and attaches them to the release.
#
# Everything is built on ubuntu-22.04 (glibc 2.35) so the deb, rpm and AppImage
# run on 22.04+, Fedora 36+ and Arch; building on a newer runner would silently
# raise the glibc floor. The Arch package is built in an Arch container, as Arch
# requires.
#
# Each format is then installed into a container of its own distribution and the
# installed binary is run, so a package that cannot start is caught here rather
# than by a user. `gamakay --version` and `gamakay list` need no keyboard.

on:
  push:
    tags: ['v*']
  # Also on pull requests that touch packaging, so the pipeline is proven before
  # a tag exists: publishing stays gated on the tag below. `workflow_dispatch`
  # alone could not do this, since GitHub only offers it for workflows that are
  # already on the default branch.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Makefile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only by default: the packaging jobs run on pull requests too, and none of
# them needs to write to the repository. Only the publishing job asks for more.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The PKGBUILD's pinned checksum matches the published archive
        run: |-
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if ! git ls-remote --tags --exit-code origin "v$version" >/dev/null 2>&1; then
            echo "v$version is not published yet; nothing to verify"
            exit 0
          fi
          pinned="$(sed -n "s/^sha256sums=('\\([0-9a-f]\\{64\\}\\)').*/\\1/p" packaging/arch/PKGBUILD)"
          actual="$(curl -fsSL "https://github.com/AessemOps/GamakayLinux/archive/v$version.tar.gz" | sha256sum | cut -d' ' -f1)"
          echo "pinned: $pinned"
          echo "actual: $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::PKGBUILD sha256sums does not match the v$version archive; regenerate it with updpkgsums"
            exit 1
          fi

      - name: Tag, Cargo and PKGBUILD versions must agree
        run: |-
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"
          else
            ./scripts/check-release-version.sh
          fi

  build:
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install the packaging tools
        run: |-
          sudo apt-get update
          # rpm is what `make package-verify` inspects the .rpm with.
          sudo apt-get install -y --no-install-recommends squashfs-tools file rpm
          mkdir -p "$HOME/.local/bin"
          # Both tools are executed in the job that mints the release, so both
          # are pinned to a tag and verified against a known digest: an asset
          # swapped upstream must not become code execution here.
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz"
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz -C "$HOME/.local/bin" nfpm
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $HOME/.local/bin/appimagetool" | sha256sum -c -
          chmod +x "$HOME/.local/bin/appimagetool"
          # appimagetool otherwise downloads this runtime itself, from a rolling
          # `continuous` URL with no check, and embeds it in every AppImage.
          curl -fsSL -o /tmp/runtime-x86_64 \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/runtime-x86_64" | sha256sum -c -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A release must not ship something the tests reject.
      - name: Test
        run: cargo test --all --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package (deb, rpm, AppImage)
        run: |-
          make package-deb package-rpm
          # appimagetool is itself an AppImage, and a runner has no FUSE, so it
          # runs itself extracted.
          make package-appimage APPIMAGE_RUNTIME=/tmp/runtime-x86_64 \
            APPIMAGETOOL="$HOME/.local/bin/appimagetool --appimage-extract-and-run"
          make package-verify
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |-
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  arch:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the package in an Arch container
        run: |-
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          url="https://github.com/AessemOps/GamakayLinux"
          rm -rf /tmp/src && mkdir -p /tmp/src
          # Prefer the *published* archive for this version: those are the exact
          # bytes the PKGBUILD's sha256sums pins, and the bytes a user builds
          # from. A version that has not been tagged yet has no archive, so
          # synthesise one from the checkout instead — and then the checksum has
          # to be skipped, because the pinned hash is for the published bytes,
          # which differ (different gzip, different metadata).
          #
          # The synthetic prefix must be what GitHub uses ("GamakayLinux-<v>",
          # the repository name) or the PKGBUILD's `cd` fails; that mistake is
          # what let a broken PKGBUILD pass CI once.
          if [ -z "${GITHUB_REF_TYPE:-}" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            if curl -fsSL -o "/tmp/src/gamakaylinux-$version.tar.gz" \
                "$url/archive/v$version.tar.gz"; then
              echo "using the published v$version archive" | tee -a "$GITHUB_STEP_SUMMARY"
              checksum_arg=""
            else
              echo "no published v$version archive; synthesising the source tarball" | tee -a "$GITHUB_STEP_SUMMARY"
              git archive --prefix="GamakayLinux-$version/" HEAD \
                | gzip -9 > "/tmp/src/gamakaylinux-$version.tar.gz"
              checksum_arg="--skipchecksums"
            fi
          else
            # On a tag the archive must exist; let makepkg enforce the checksum.
            curl -fsSL -o "/tmp/src/gamakaylinux-$version.tar.gz" \
              "$url/archive/v$version.tar.gz"
            checksum_arg=""
          fi
          docker run --rm -v /tmp/src:/src:ro -v "$PWD/out:/out" -w /src archlinux@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0 \
            bash -euo pipefail -c "
              pacman -Syu --noconfirm --needed base-devel git rust cargo >/dev/null
              useradd -m builder
              install -d -o builder -g builder /home/builder/pkg
              install -o builder -g builder -m644 /src/gamakaylinux-*.tar.gz /home/builder/pkg/
              su builder -c \"cd ~/pkg && tar xzf gamakaylinux-*.tar.gz --wildcards 'GamakayLinux-*/packaging/arch/*' && install -m644 GamakayLinux-*/packaging/arch/PKGBUILD GamakayLinux-*/packaging/arch/gamakaylinux.install . && makepkg -f --noconfirm --nodeps $checksum_arg\"
              install -m644 /home/builder/pkg/*.pkg.tar.zst /out/
            "
          ls -l out

          docker run --rm -v /tmp/src:/src:ro -v "$PWD/out:/out" -w /src archlinux@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0 \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel git rust cargo >/dev/null
              # makepkg refuses to run as root; build as an unprivileged user in
              # a writable copy. --nodeps because the runtime dependencies are
              # what the install step below is for: this container has no X, no
              # GL and no fonts, and the package must still build.
              useradd -m builder
              install -d -o builder -g builder /home/builder/pkg
              install -o builder -g builder -m644 /src/gamakaylinux-*.tar.gz /home/builder/pkg/
              # The PKGBUILD and its install scriptlet come out of the tarball
              # we just built, so they cannot drift from the source being built.
              su builder -c "cd ~/pkg && tar xzf gamakaylinux-*.tar.gz --wildcards 'GamakayLinux-*/packaging/arch/*' && install -m644 GamakayLinux-*/packaging/arch/PKGBUILD GamakayLinux-*/packaging/arch/gamakaylinux.install . && makepkg -f --noconfirm --nodeps"
              install -m644 /home/builder/pkg/*.pkg.tar.zst /out/
            '
          ls -l out

      - name: Install and run it
        run: |-
          docker run --rm -v "$PWD/out:/out:ro" archlinux@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0 bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed >/dev/null
            pacman -U --noconfirm /out/*.pkg.tar.zst
            gamakay --version
            gamakay list
            test -f /usr/share/applications/gamakay.desktop
            test -f /usr/share/icons/hicolor/256x256/apps/gamakay.png
            test -f /usr/lib/udev/rules.d/70-gamakay.rules
          '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: out/*.pkg.tar.zst

  verify-deb:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Install the .deb and run it
        run: |-
          sudo apt-get update
          sudo apt-get install -y ./dist/gamakaylinux_*_amd64.deb
          gamakay --version
          gamakay list
          test -f /usr/share/applications/gamakay.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/gamakay.png

  verify-rpm:
    needs: build
    runs-on: ubuntu-latest
    container: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Install the .rpm and run it
        run: |-
          dnf install -y ./dist/gamakaylinux-*.rpm
          gamakay --version
          gamakay list
          test -f /usr/share/applications/gamakay.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/gamakay.png

  verify-appimage:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Run the AppImage's CLI
        run: |-
          chmod +x dist/*.AppImage
          # No FUSE on a runner: extract and run instead.
          ./dist/GamakayLinux-*-x86_64.AppImage --appimage-extract-and-run --version
          ./dist/GamakayLinux-*-x86_64.AppImage --appimage-extract-and-run list

  release:
    needs: [build, arch, verify-deb, verify-rpm, verify-appimage]
    if: github.ref_type == 'tag' && github.event_name == 'push'
    permissions:
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Checksums
        run: |-
          cd artifacts
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.pkg.tar.zst' \) -exec sha256sum {} + | sed 's|  \./|  |' \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the artefacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |-
            artifacts/packages/*.deb
            artifacts/packages/*.rpm
            artifacts/packages/*.AppImage
            artifacts/arch/*.pkg.tar.zst

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |-
            artifacts/SHA256SUMS
            artifacts/packages/*.deb
            artifacts/packages/*.rpm
            artifacts/packages/*.AppImage
            artifacts/arch/*.pkg.tar.zst
          generate_release_notes: true

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# The default token is read-only: nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all --locked
      - name: Build (release)
        run: cargo build --release --locked

  # Advisory and MSRV gates. Neither can fail the build today for a reason we
  # cannot act on (see .cargo/audit.toml), so they are informational-but-real:
  # a new advisory, or a dependency that stops compiling on the declared
  # minimum (1.86: the Wayland stack needs it), shows up here rather than after
  # a release.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: cargo audit
        run: |-
          cargo install cargo-audit --locked
          cargo audit

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.86"
      - name: The declared minimum Rust version actually compiles the tree
        run: cargo check --all-targets --locked

  # Cheap checks for the things that would only fail during a release: a version
  # that drifted between the three places it is written, or an icon the desktop
  # entry names and the packages do not ship (appimagetool refuses to build in
  # that case, so it is worth catching on the pull request).
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version fields agree
        run: ./scripts/check-release-version.sh
      - name: The desktop entry's icon is shipped
        run: |-
          icon="$(sed -n 's/^Icon=//p' packaging/gamakay.desktop)"
          test -n "$icon" || { echo "no Icon= in the desktop entry"; exit 1; }
          test -f "packaging/icons/$icon.png"
          for size in 16 24 32 48 64 128 256 512; do
            test -f "packaging/icons/hicolor/${size}x${size}/apps/$icon.png" \
              || { echo "missing ${size}x${size} icon"; exit 1; }
          done
          echo "icons ok for $icon"

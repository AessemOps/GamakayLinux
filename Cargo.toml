[workspace]
resolver = "2"
members = [
    "crates/gamakay-core",
    "crates/gamakay-hidraw",
    "crates/gamakay-cli",
    "crates/gamakay-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88, not 1.86: iced 0.14 declares it. The Wayland stack alone would need
# 1.86. `cargo check` on 1.88 is a CI job.
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/AessemOps/GamakayLinux"
authors = ["GamakayLinux contributors"]

[workspace.dependencies]
gamakay-core = { path = "crates/gamakay-core" }
gamakay-hidraw = { path = "crates/gamakay-hidraw" }

# Small runtime footprint: nothing is pulled in that is not used.
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

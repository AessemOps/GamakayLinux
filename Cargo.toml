[workspace]
resolver = "2"
members = [
    "crates/gamakay-core",
    "crates/gamakay-hidraw",
    "crates/gamakay-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/AessemOps/GamakayLinux"
authors = ["GamakayLinux contributors"]

[workspace.dependencies]
gamakay-core = { path = "crates/gamakay-core" }
gamakay-hidraw = { path = "crates/gamakay-hidraw" }

# Small runtime footprint: nothing is pulled in that is not used.
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

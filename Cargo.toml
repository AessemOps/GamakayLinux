[workspace]
resolver = "2"
members = [
    "crates/lk67-core",
    "crates/lk67-hidraw",
    "crates/lk67-cli",
    "crates/lk67-gui",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
# 1.90, not 1.88: iced 0.14 declares 1.88, but two crates in its tree need
# more — ordered-float 5.5 wants 1.90 and uuid 1.28 wants 1.89. `cargo check` on
# 1.90 is a CI job, so this cannot drift.
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/AessemOps/lk67ctl"
authors = ["lk67ctl contributors"]

[workspace.dependencies]
lk67-core = { path = "crates/lk67-core" }
lk67-hidraw = { path = "crates/lk67-hidraw" }

# Small runtime footprint: nothing is pulled in that is not used.
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
